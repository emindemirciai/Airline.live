# Yerel geliştirme altyapısı. Uygulamalar `pnpm dev` ile makinede çalışır.
#   docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 300
# Portlar 41xxx–49xxx aralığındadır: Windows'un dinamik port bölgesinin (49152+) altında kalır,
# böylece Hyper-V/WinNAT'ın açılışta ayırdığı aralıklarla çakışmaz (D-065). 3000–3003 başka
# projenindir. Değerler .env.example'daki geliştirme varsayılanlarıyla aynıdır.
name: havayolu-dev

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: havayolu
      POSTGRES_PASSWORD: havayolu_dev_only
      POSTGRES_DB: app_dev
    ports:
      - '127.0.0.1:45432:5432'
    volumes:
      - dev_pgdata:/var/lib/postgresql
    # TCP üzerinden denenir: PostGIS ilk kurulumunda geçici sunucu yalnızca unix soketini dinler.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U havayolu -d app_dev']
      interval: 3s
      timeout: 3s
      retries: 20

  redis-queue:
    image: redis:8.10.2-alpine
    command:
      [
        redis-server,
        --requirepass,
        queue_dev_only,
        --maxmemory,
        128mb,
        --maxmemory-policy,
        noeviction,
        --appendonly,
        'yes',
      ]
    environment:
      REDISCLI_AUTH: queue_dev_only
    ports:
      - '127.0.0.1:46379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  redis-live:
    image: redis:8.10.2-alpine
    command:
      [
        redis-server,
        --requirepass,
        live_dev_only,
        --maxmemory,
        192mb,
        --maxmemory-policy,
        volatile-ttl,
        --save,
        '',
        --appendonly,
        'no',
      ]
    environment:
      REDISCLI_AUTH: live_dev_only
    ports:
      - '127.0.0.1:46380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - '127.0.0.1:48025:8025'
      - '127.0.0.1:41025:1025'

volumes:
  dev_pgdata:
