name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR çalışmaları yeni commit gelince iptal edilir; main çalışmaları iptal edilmez
# (buradan çağrılan deploy işi yarıda kesilmesin diye).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  EXTERNAL_PROVIDERS_DISABLED: 'true'

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Line endings
        run: pnpm run check:eol
      - name: Changelog and version
        run: pnpm run changelog:check
      - name: Scripts typecheck
        run: pnpm run typecheck:scripts
      - name: E2E typecheck and lint
        run: pnpm run typecheck:e2e && pnpm run lint:e2e
      - name: Migrations match schema (drizzle-kit generate is empty)
        run: pnpm run db:check
      - name: Compose guard
        run: pnpm run compose:guard
      - name: Deploy script tests (stub Dokploy, fake clock)
        run: pnpm run test:scripts
      # Unit tests run on their own, two packages at a time (D-105): in one combined turbo run they
      # shared the runner's CPUs with tsc, ESLint and the Next build, and API route tests that take
      # ~50 ms locally hit vitest's 5 s timeout.
      - name: Lint and typecheck
        run: pnpm exec turbo run lint typecheck
      - name: Unit tests
        run: nproc && pnpm exec turbo run test --concurrency=2
      - name: Build
        run: pnpm exec turbo run build

  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # İki commit: yükseltme testi temel olarak HEAD^1'i kullanır. PR'da bu, main'in ucudur
      # (birleştirme commit'inin ilk ebeveyni); main push'unda test edilen commit'ten önceki main'dir.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostGIS, Redis (queue, live) and Mailpit
        run: docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 300
      - name: Integration tests
        run: pnpm run test:integration
      - name: Migration upgrade test (base commit, then this commit)
        run: pnpm run test:migration-upgrade
        env:
          MIGRATION_BASE_REF: HEAD^1
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail 200

  # Tarayıcı testleri (Playwright, Chromium; WebGL2 GPU'suz SwiftShader'la). Web sunucusu
  # `pnpm dev:replay`dir: replay alıcısı + web, API ve worker; canlı veri sentetik senaryodan gelir,
  # harita yerel test stiliyle açılır, dış servise istek atılmaz. Henüz `changes` işi olmadığı için
  # her PR'da ve main push'unda çalışır; Actions dakikası bedeli D-075'te.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies (browser from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Start PostGIS and Redis (queue, live)
        run: >-
          docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 300
          postgres redis-queue redis-live
      - name: Migrations, track partitions and seed stations
        run: pnpm run db:migrate
      - name: E2E tests (pnpm dev:replay, Chromium)
        run: pnpm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/.report
          # Klasör adı noktayla başlar; gizli dosyalar varsayılan olarak yüklenmez.
          include-hidden-files: true
          retention-days: 7
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail 200

  # main'e her push'ta ve bütün kontroller yeşilken. "Yalnızca belge değişti" kararı burada değil,
  # release işinde canlıdaki sürüme göre verilir; son push'a göre verilseydi, arkasından belge
  # birleşmesi gelen bir kod birleşmesi hiç yayınlanmazdı (D-064). Dokploy kurulumu bitene kadar
  # (DEPLOY_ENABLED) imajlar derlenir, yayın adımı özetle atlanır.
  deploy:
    name: deploy
    needs: [checks, test-integration, e2e, actionlint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # contents: write yalnızca release işinde kullanılır: release dalına yayın commit'i (D-070).
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  # main'e birleşen her sürüm GitHub Releases'ta v<sürüm> etiketiyle yayımlanır (D-067). Not TR + EN
  # olarak changelog'dan gelir. O sürümün release'i zaten varsa (ör. sürüm artırmayan belge
  # birleşmesi) iş bir şey yapmadan biter. Yayın işi başarısız olursa release oluşturulmaz.
  github-release:
    name: github-release
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish the GitHub release for this version
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "GitHub Release v${version} zaten var; atlandı." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm --silent exec tsx scripts/changelog.mts --release "${version}" > "${RUNNER_TEMP}/release.md"
          title="$(head -n 1 "${RUNNER_TEMP}/release.md")"
          tail -n +3 "${RUNNER_TEMP}/release.md" > "${RUNNER_TEMP}/notes.md"
          gh release create "v${version}" --target "${GITHUB_SHA}" --title "${title}" \
            --notes-file "${RUNNER_TEMP}/notes.md" --latest
          echo "GitHub Release v${version} yayımlandı." >> "$GITHUB_STEP_SUMMARY"
