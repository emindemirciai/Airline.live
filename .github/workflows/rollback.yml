name: Rollback

# Seçilen commit'in imajlarını (sha-<7>) :main olarak yeniden etiketler, release dalına o commit'in
# ağacıyla bir commit gönderir (Dokploy Autodeploy; force push yok) ve deploy.yml ile aynı doğrulamayı
# yapar (infra.md → rollback.yml, D-064, D-070). Sonraki birleştirme (belge
# değişikliği bile) canlıdan farkı yayınlayarak main'i yeniden ileri alır; sorunlu değişiklik önce bir
# PR ile geri alınmalıdır. Migration'lar geri alınmaz: şema değişiklikleri geriye uyumludur.
# Geri alma kapısı (D-115): hedef v0.28.0'dan eskiyse, sürümü okunamıyorsa ya da yalnız-havayolu
# süzgecinin dosyaları yoksa iş, hiçbir etiket taşınmadan reddedilir. Eski imajlar süzgeci ve canlı
# katman anahtarını tanımaz; CONTACT_EMAIL girildiyse bütün uçakları yayınlar. İş Dokploy'daki env'i
# göremez: `allow_pre_live_gate`, CONTACT_EMAIL'in önce boşaltıldığının beyanıdır (DEPLOY_DOKPLOY §12).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Geri dönülecek commit SHA'sı (en az 7 karakter; GHCR'da sha-<7> imajları olmalı)
        required: true
        type: string
      allow_pre_live_gate:
        description: v0.28.0'dan eski hedefe izin ver (yalnız Dokploy'da CONTACT_EMAIL boşaltılıp yeniden deploy edildiyse; D-115)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/emindemirciai/havayolu

jobs:
  rollback:
    name: rollback
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Validate SHA
        id: sha
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          sha="$(printf '%s' "$TARGET_SHA" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::sha 7-40 karakterlik bir commit SHA'sı olmalı"
            exit 1
          fi
          echo "full=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
      # Tam geçmiş: yayın commit'i seçilen (eski) commit'in ağacından kurulur.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Geri dönülen commit'in sürümü yayın başlığına yazılır (D-087); okunamazsa boş kalır.
      - name: Read the target version
        id: version
        env:
          TARGET: ${{ steps.sha.outputs.full }}
        run: |
          version="$(git show "${TARGET}:package.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',(c)=>(s+=c)).on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # Etiketler taşınmadan önce: reddedilirse :main ve canlı yayın değişmez (scripts/rollback-guard.mts).
      - name: Live aircraft gate (D-115)
        env:
          TARGET_SHA: ${{ steps.sha.outputs.full }}
          ALLOW_PRE_LIVE_GATE: ${{ inputs.allow_pre_live_gate }}
        run: pnpm exec tsx scripts/rollback-guard.mts
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :main at the chosen build
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          # Önce üç imajın da var olduğu doğrulanır; biri eksikse hiçbir etiket taşınmaz.
          for app in web api worker; do
            if ! docker buildx imagetools inspect "${IMAGE_PREFIX}-${app}:sha-${SHORT_SHA}" > /dev/null; then
              echo "::error::${IMAGE_PREFIX}-${app}:sha-${SHORT_SHA} bulunamadı (main'de deploy işi derlemiş bir commit seçilmeli)"
              exit 1
            fi
          done
          for app in web api worker; do
            docker buildx imagetools create \
              --tag "${IMAGE_PREFIX}-${app}:main" \
              "${IMAGE_PREFIX}-${app}:sha-${SHORT_SHA}"
          done
      - name: Deploy (release branch → Dokploy Autodeploy) and verify
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_TRIGGER: ${{ vars.DEPLOY_TRIGGER }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
          EXPECTED_SHA: ${{ steps.sha.outputs.full }}
          DEPLOY_TITLE: rollback ${{ steps.version.outputs.version && format('v{0} ', steps.version.outputs.version) || '' }}${{ steps.sha.outputs.short }} (run ${{ github.run_id }})
        run: pnpm run deploy:dokploy
