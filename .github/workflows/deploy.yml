name: Deploy

# main'e her birleştirmede CI'dan çağrılır; elle deneme için workflow_dispatch (dry_run varsayılan açık).
# Sözleşme: docs/spec/infra.md → deploy.yml ve D-064.
# - build: üç imaj paralel derlenir ve yalnızca sha-<7> etiketiyle GHCR'a gönderilir.
# - release: seri çalışır (deploy-prod). Commit hâlâ main'in ucundaysa :main etiketini bu derlemeye
#   taşır, Dokploy'u tetikler ve /version + /ready ile doğrular. Canlıdan bu yana yalnızca belge ya
#   da mobil uygulama değiştiyse Dokploy tetiklenmez. DEPLOY_ENABLED=true olana kadar yayın adımı
#   özetle atlanır ve iş yeşil kalır.
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Yalnızca imajları derle ve sha- etiketiyle gönder; yayınlama
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/emindemirciai/havayolu

jobs:
  build:
    name: build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        app: [web, api, worker]
    steps:
      - uses: actions/checkout@v7
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=havayolu-${{ matrix.app }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push sha tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=havayolu-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=havayolu-${{ matrix.app }}

  release:
    name: release
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Yayınlar (ve rollback.yml) sırayla çalışır; yarıda kesilmez.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # Tam geçmiş: deploy script'i canlıdaki sürümle bu commit arasındaki farka bakar.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # main'e her push kendi yayın işini çalıştırır (ci.yml), bu yüzden daha yeni bir uç varsa
      # onun işi bu commit'i de kapsayarak yayınlar. main okunamazsa iş kırmızıya döner.
      - name: Is this commit still the tip of main?
        id: head
        shell: bash
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ ! "$tip" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::main'in ucu okunamadı"
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Dokploy yayını"
              echo
              echo "ATLANDI: main'de daha yeni bir commit var (${tip:0:7}); onun yayın işi bu commit'i de kapsar."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.head.outputs.latest == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.head.outputs.latest == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :main at this build
        if: steps.head.outputs.latest == 'true'
        run: |
          short="${GITHUB_SHA:0:7}"
          for app in web api worker; do
            docker buildx imagetools create \
              --tag "${IMAGE_PREFIX}-${app}:main" \
              "${IMAGE_PREFIX}-${app}:sha-${short}"
          done
      - if: steps.head.outputs.latest == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.head.outputs.latest == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.head.outputs.latest == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy to Dokploy and verify
        if: steps.head.outputs.latest == 'true'
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
          EXPECTED_SHA: ${{ github.sha }}
          # Canlıdan bu yana yalnızca docs/ ya da apps/mobile/ değiştiyse Dokploy tetiklenmez.
          SKIP_UNCHANGED: 'true'
        run: pnpm run deploy:dokploy
